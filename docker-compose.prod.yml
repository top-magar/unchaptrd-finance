services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: unchaptrd_finance
    volumes:
      - unchaptrd_postgres_prod_data:/var/lib/postgresql/data
    networks:
      - coolify

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/unchaptrd_finance?schema=public"
    command: >
      sh -c "npx prisma db push && node server.js"
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.unchaptrd.rule=Host(`finance.topmagar.com`) || Host(`80.225.213.100`)"
      - "traefik.http.routers.unchaptrd.entrypoints=http"
      - "traefik.http.services.unchaptrd.loadbalancer.server.port=3000"
    networks:
      - coolify

volumes:
  unchaptrd_postgres_prod_data:

networks:
  coolify:
    external: true
